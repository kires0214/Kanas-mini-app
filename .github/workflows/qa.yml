name: MVP QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_DB: kanas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-local-password@127.0.0.1:5432/kanas_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:e2e
      - name: Preserve owned process lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-resource-ledger
          path: .task-resources.jsonl
          if-no-files-found: ignore
          retention-days: 7
